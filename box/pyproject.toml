[project]
name = "coupured"
version = "0.1.0"
description = "Coupure box daemon: island state, ledger, receipts, reserves, cash-out queue"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "fastapi==0.165.0",
  "uvicorn==0.54.0",
  "httpx>=0.28,<0.29",
  "pydantic==2.14.3",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "hypothesis>=6.100",
  "ruff>=0.8",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC"]
ignore = ["S101", "ASYNC109", "ASYNC240"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["coupured"]
